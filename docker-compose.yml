services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corebanking}
      POSTGRES_USER: ${POSTGRES_USER:-corebanking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres major-version bumps need `docker compose down -v` first (old data dir won't start).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corebanking} -d ${POSTGRES_DB:-corebanking}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
